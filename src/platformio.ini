[platformio]
default_envs = edgevision32

; ============================================================
; EdgeVision32 - Production Environment
; ============================================================
[env:edgevision32]
platform = espressif32@^6.5.0
board = esp32cam
framework = arduino

; Serial Monitor
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    colorize
    time

; Upload settings
upload_speed = 921600

; Compiler flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_SPIRAM_SUPPORT=1
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -Os
    ; Include paths
    -Iinclude
    -Isrc

; Board configuration
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Libraries
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    ; Note: SD_MMC is built-in, no need to install

; ============================================================
; Debug Environment
; ============================================================
[env:edgevision32-debug]
extends = env:edgevision32
build_type = debug
build_flags = 
    ${env:edgevision32.build_flags}
    -DDEBUG=1
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_ESP_PORT=Serial
    -g

monitor_filters = 
    esp32_exception_decoder
    colorize
    time
    log2file

; ============================================================
; Release Environment (Optimized)
; ============================================================
[env:edgevision32-release]
extends = env:edgevision32
build_type = release
build_flags = 
    ${env:edgevision32.build_flags}
    -DNDEBUG
    -DCORE_DEBUG_LEVEL=0
    -O3
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

monitor_filters = colorize

; ============================================================
; OTA Environment
; ============================================================
[env:edgevision32-ota]
extends = env:edgevision32
upload_protocol = espota
upload_port = 192.168.1.100  ; Change to your device IP
upload_flags = 
    --auth=edgevision32
    --port=3232

board_build.partitions = default_ota.csv
